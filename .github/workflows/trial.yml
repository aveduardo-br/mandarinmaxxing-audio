name: Voice trial

# Records a short list of words with several voices, to compare them by ear before a full run.

on:
  workflow_dispatch:
    inputs:
      voices:
        description: key=voice_id pairs, separated by commas
        required: true
      words:
        description: Words, separated by commas
        required: true

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up the tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet requests pypinyin
      - name: Record
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/trial.py --voices "${{ inputs.voices }}" --words "${{ inputs.words }}"
      - name: Save the files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all trials
          git diff --cached --quiet || git commit -m "Voice trial"
          git push
